[project]
name = "rushlab"
version = "0.1.0"
description = "Agent-driven traffic scenario lab for the San Ysidro border approach in Tijuana"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "eCabral87" }]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "osmnx>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "eclipse-sumo>=1.20",
    "traci>=1.20",
    "pulp>=2.8",
    "deap>=1.4",
    "mcp[cli]>=1.0",
]

[project.scripts]
rushlab = "rushlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "tiktoken>=0.7",
    "graphifyy[mcp]>=0.9.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rushlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: tests that need live network access"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
